name: Actualizar indicadores

on:
  schedule:
    - cron: "0 23 * * *"   # todos los dias a las 23:00 UTC (4:00 pm hora de Tijuana en horario de verano)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Consultar Banxico y actualizar indicadores.json
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python3 scripts/actualizar_indicadores.py

      - name: Guardar cambios si los hubo
        run: |
          if [ -n "$(git status --porcelain indicadores.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add indicadores.json
            git commit -m "Actualiza indicadores (Banxico)"
            git push
          else
            echo "Sin cambios que guardar."
          fi
